async function ouvrir(mdp){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.sel),iterations:T,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
